<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef0ee">
<meta name="description" content="HAYGER — one day at a time. Goals, streaks, history and daily progress.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HAYGER">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>HAYGER — Ultra</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef0ee;--surface:#ffffff;--soft:#e6e9e6;--soft2:#dde1dd;
  --text:#14161a;--muted:#6c716f;--line:#dbdfdb;--danger:#c23b3b;
  --primary:#14161a;--primaryText:#fff;
  --accent:#b9791f;--accent-soft:rgba(185,121,31,.13);
  --shadow:0 20px 60px rgba(20,22,26,.10);
  --xl:32px;--lg:21px;--md:15px;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
[data-theme=dark]{
  --bg:#0b0c10;--surface:#15171c;--soft:#1c1f26;--soft2:#262a31;
  --text:#f4f4f2;--muted:#93979f;--line:#2a2e36;--danger:#ff8a8a;
  --primary:#f4f4f2;--primaryText:#101114;
  --accent:#e3a94a;--accent-soft:rgba(227,169,74,.16);
  --shadow:0 26px 74px rgba(0,0,0,.46);
}
html,body{margin:0;height:100%}
body{
  height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:background .25s,color .25s;
}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app-shell{display:flex;flex-direction:column;height:100%}
.app-header{flex:0 0 auto;padding:max(16px,env(safe-area-inset-top)) 20px 13px;border-bottom:1px solid var(--line)}
.app-header-inner{display:flex;align-items:center;justify-content:space-between;max-width:460px;margin:0 auto;width:100%}
.brand{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:1.5px;line-height:1}
.brand-sub{margin-top:5px;color:var(--muted);font-size:9px;font-weight:750;letter-spacing:1.6px}
.theme-button{
  width:40px;height:40px;padding:0;display:grid;place-items:center;flex:0 0 auto;
  border:1px solid var(--line);border-radius:13px;background:var(--soft);color:var(--text);
  transition:transform .18s,background .2s;
}
.theme-button:active{transform:scale(.92)}
.theme-button svg{width:17px;height:17px}
.app-scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px 26px}
body.has-tabbar .app-scroll{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.container{width:100%;max-width:460px;margin:0 auto;animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.app-tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;
  justify-content:space-around;align-items:stretch;gap:2px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}
body.has-tabbar .app-tabbar{display:flex}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-width:0;padding:6px 2px;border:0;background:transparent;color:var(--muted);
  font-size:9px;font-weight:800;letter-spacing:.2px;border-radius:13px;transition:.15s}
.tab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab-btn.active{color:var(--text)}
.tab-btn.active svg{stroke:var(--accent)}
.tab-btn:active{transform:scale(.93)}

.ring-wrap{position:relative;width:198px;height:198px;margin:6px auto 0}
.ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--soft2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.22,.9,.3,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label{font-size:10px;font-weight:850;letter-spacing:2.4px;color:var(--muted)}
.ring-number{font-family:var(--font-display);font-size:clamp(54px,16vw,74px);font-weight:700;line-height:1;letter-spacing:-2px;margin-top:3px}

.hero-panel{padding:10px 4px 4px;text-align:center}
.hero-date{margin-top:18px;color:var(--muted);font-size:13.5px;font-weight:600}
.hero-tag{margin:14px auto 0;width:max-content;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--muted);font-size:10px;font-weight:800;display:flex;align-items:center;gap:6px}
.streak-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#55bd7e;box-shadow:0 0 0 4px rgba(85,189,126,.1)}
.message{margin:20px 3px 0;padding:15px 14px;border-radius:17px;background:var(--soft);color:var(--muted);font-size:12.5px;line-height:1.55;text-align:center;box-shadow:0 5px 16px rgba(0,0,0,.025)}
.checkin{margin-top:14px!important;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--surface);text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.035)}
.streak-dot{position:relative;width:7px;height:7px;box-shadow:0 0 0 4px rgba(85,189,126,.10);animation:statusPulse 2.2s ease-in-out infinite}
.streak-dot:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(85,189,126,.35);animation:statusRing 2.2s ease-out infinite}
@keyframes statusPulse{0%,100%{transform:scale(.92);opacity:.8}50%{transform:scale(1.16);opacity:1}}
@keyframes statusRing{0%{transform:scale(.75);opacity:.7}70%,100%{transform:scale(1.75);opacity:0}}
@media(prefers-reduced-motion:reduce){.streak-dot,.streak-dot:after{animation:none!important}}
.message strong{color:var(--text);font-weight:800}

.button{
  width:100%;min-height:50px;border:0;border-radius:var(--md);
  font-size:13px;font-weight:850;transition:transform .15s,opacity .15s,background .2s
}
.button:active{transform:scale(.985)}
.primary{background:var(--primary);color:var(--primaryText)}
.secondary{background:var(--soft);color:var(--text)}
.setup{padding:24px 8px 8px;text-align:center}
.setup-icon{
  width:60px;height:60px;margin:0 auto 18px;display:grid;place-items:center;
  border-radius:19px;background:var(--primary);color:var(--primaryText);
  font-family:var(--font-display);font-size:23px;font-weight:700;position:relative;
}
.setup-icon:after{content:"";position:absolute;inset:-5px;border-radius:24px;border:1.5px solid var(--accent);opacity:.5}
.setup h1{margin:0;font-family:var(--font-display);font-size:27px;font-weight:700;letter-spacing:-.4px}
.setup p{margin:10px auto 25px;max-width:330px;color:var(--muted);font-size:14px;line-height:1.55}
.field{text-align:left}
.field-label{display:block;margin:0 0 7px 2px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.date-input{
  width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:var(--md);
  outline:none;color:var(--text);background:var(--surface);font-size:16px;
  user-select:auto;-webkit-user-select:auto;color-scheme:light;
}
[data-theme=dark] .date-input{color-scheme:dark}
.date-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.error{min-height:19px;margin-top:7px;color:var(--danger);font-size:12px;font-weight:650;text-align:left}
.footer{margin-top:18px;text-align:center;color:var(--muted);font-size:10px;font-weight:650;letter-spacing:.2px}
.modal-backdrop{
  position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;
  padding:16px;background:rgba(10,10,12,.5);backdrop-filter:blur(6px)
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(100%,460px);padding:20px;border:1px solid var(--line);border-radius:24px;
  background:var(--surface);box-shadow:var(--shadow);animation:up .25s ease both
}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.2px}
.modal p{margin:8px 0 17px;color:var(--muted);font-size:13px;line-height:1.5}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.toast{
  position:fixed;z-index:70;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
  transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:10px 14px;
  border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);
  box-shadow:var(--shadow);font-size:11px;font-weight:800;transition:.25s
}
body.has-tabbar .toast{bottom:max(88px,calc(70px + env(safe-area-inset-bottom)))}
.toast.show{opacity:1;transform:translate(-50%,0)}

.section-title{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.3px;margin:0 0 14px}

.checkin{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);text-align:center}
.checkin-text{color:var(--muted);font-size:11px;font-weight:750}
.checkin-button{margin-top:9px;width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;background:var(--soft);color:var(--text);font-size:12px;font-weight:900;transition:.15s}
.checkin-button:active{transform:scale(.985)}
.checkin-button.done{background:var(--primary);color:var(--primaryText)}
.milestone{margin-top:14px;text-align:center;color:var(--muted);font-size:10.5px;font-weight:750}
.milestone strong{color:var(--accent)}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:13px 7px;border:1px solid var(--line);border-radius:15px;background:var(--soft);text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.4px}
.stat span{display:block;margin-top:4px;color:var(--muted);font-size:8.5px;font-weight:800}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:6px}
.calendar-title{font-family:var(--font-display);font-size:15px;font-weight:700}
.cal-nav{width:32px;height:32px;flex:0 0 auto;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);font-weight:900}
.cal-today-btn{flex:0 0 auto;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);font-size:9px;font-weight:900;letter-spacing:.3px}
.cal-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--soft)}
.cal-summary-item b{display:block;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1}
.cal-summary-item span{display:block;margin-top:5px;color:var(--muted);font-size:8px;font-weight:850;letter-spacing:.5px;text-transform:uppercase}
.cal-summary-div{width:1px;align-self:stretch;background:var(--line)}
.heatmap-card{padding:13px 12px 11px;margin-bottom:12px;border:1px solid var(--line);border-radius:16px;background:var(--soft);overflow-x:auto}
.heatmap-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.heatmap-title b{font-size:10px;font-weight:900;letter-spacing:.6px}
.heatmap-title span{color:var(--muted);font-size:9px;font-weight:750}
.heatmap-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3.5px;min-width:100%}
.heat-cell{width:15px;height:15px;border-radius:4px;background:var(--soft2)}
.heat-cell.done{background:var(--accent)}
.heat-cell.future{visibility:hidden}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;color:var(--muted);font-size:8px;font-weight:900;padding-bottom:5px}
.cal-day{position:relative;aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--text);font-size:11px;font-weight:750;transition:transform .12s}
.cal-day:active{transform:scale(.92)}
.cal-day.done{background:var(--accent);color:#1c1204;border-color:var(--accent)}
.cal-day.today{box-shadow:0 0 0 2px var(--text)}
.cal-day.empty{visibility:hidden;pointer-events:none}
.cal-mood-badge{position:absolute;bottom:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:1.5px solid var(--bg);display:grid;place-items:center;font-size:9px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.day-detail-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.day-detail-row:last-child{border-bottom:0}
.day-detail-label{flex:0 0 auto;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.4px;text-transform:uppercase;width:70px}
.day-detail-value{flex:1;font-size:12px;font-weight:650;color:var(--text)}
.day-detail-mood{font-size:20px}
.notes{padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--soft)}
.notes textarea{width:100%;min-height:92px;resize:none;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--surface);color:var(--text);outline:none;font:inherit;font-size:12px}
.notes textarea:focus{border-color:var(--accent)}
.save-note{margin-top:8px;width:100%;min-height:43px;border:0;border-radius:12px;background:var(--primary);color:var(--primaryText);font-size:11px;font-weight:900}
.note-meta{margin-top:7px;color:var(--muted);font-size:9px;text-align:center}

.goal-card,.settings-card{padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--soft)}
.goal-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.goal-title{font-size:12px;font-weight:900}.goal-value{color:var(--muted);font-size:10px;font-weight:800}
.progress-track{height:7px;margin-top:10px;border-radius:999px;background:var(--soft2);overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .35s ease}
.goal-controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.small-button{min-height:38px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);font-size:10px;font-weight:900}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-copy b{display:block;font-size:11px}.setting-copy span{display:block;margin-top:3px;color:var(--muted);font-size:9px;line-height:1.35}
.time-input,.select-input{height:40px;padding:0 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:12px;outline:none}
.file-input{display:none}
.danger-button{width:100%;min-height:42px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--danger);font-size:10px;font-weight:900}
.note-list{margin-top:10px;display:grid;gap:7px}
.note-item{padding:10px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.note-item b{font-size:10px}.note-item p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.4;white-space:pre-wrap}
.reminder-status{margin-top:8px;color:var(--muted);font-size:9px;line-height:1.4}

@media(max-width:360px){.app-header{padding-left:14px;padding-right:14px}.app-scroll{padding-left:14px;padding-right:14px}.ring-wrap{width:172px;height:172px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* PWA update banner */
.update-banner{
  position:fixed;z-index:100;left:50%;bottom:max(16px,env(safe-area-inset-bottom));
  transform:translate(-50%,120px);opacity:0;pointer-events:none;
  width:min(calc(100% - 28px),440px);padding:13px 14px;
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--line);border-radius:17px;
  background:var(--surface);color:var(--text);box-shadow:var(--shadow);
  transition:transform .28s ease,opacity .28s ease;
}
body.has-tabbar .update-banner{bottom:max(86px,calc(78px + env(safe-area-inset-bottom)))}
.update-banner.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.update-icon{
  flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;
  border-radius:11px;background:var(--accent-soft);color:var(--accent);
}
.update-icon svg{width:17px;height:17px}
.update-copy{flex:1;min-width:0}
.update-copy b{display:block;font-size:12px;font-weight:900}
.update-copy span{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.3}
.update-button{
  flex:0 0 auto;min-height:38px;padding:0 13px;border:0;border-radius:11px;
  background:var(--accent);color:#1c1204;font-size:10px;font-weight:900;
}
.update-close{
  flex:0 0 auto;width:30px;height:30px;border:1px solid var(--line);border-radius:9px;
  background:var(--soft);color:var(--text);font-size:15px;line-height:1;
}

/* Ultra: badges */
.badge-section{margin-top:14px}
.badge-section-title{margin:0 0 8px 2px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase}
.badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{padding:11px 4px 9px;border:1px solid var(--line);border-radius:15px;background:var(--soft);text-align:center;opacity:.4;transition:.2s}
.badge.unlocked{opacity:1;background:var(--surface);border-color:var(--accent);box-shadow:0 6px 18px rgba(185,121,31,.12)}
.badge-icon{font-size:19px;line-height:1}
.badge-label{margin-top:5px;font-size:8px;font-weight:850;color:var(--muted);letter-spacing:.2px}
.badge.unlocked .badge-label{color:var(--text)}

/* Ultra: mood */
.mood-row{display:flex;gap:6px;margin-top:11px;justify-content:center}
.mood-chip{width:39px;height:39px;padding:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:17px;transition:.15s}
.mood-chip.active{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.06)}
.mood-hint{margin-top:8px;color:var(--muted);font-size:9px;font-weight:750;text-align:center}

/* Ultra: charts */
.chart-card{padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--soft)}
.chart-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.chart-title b{font-size:11px;font-weight:900}
.chart-title span{color:var(--muted);font-size:9px;font-weight:750}
.chart-card canvas{display:block;width:100%;height:74px}

/* Ultra: notes search */
.note-search{width:100%;height:40px;padding:0 12px;margin-top:10px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);outline:none;font-size:11px}
.note-search:focus{border-color:var(--accent)}
.note-empty{margin-top:10px;color:var(--muted);font-size:10px;text-align:center}

/* Ultra: share */
.share-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}

/* Ultra: PIN lock */
.pin-dots{display:flex;gap:12px;justify-content:center;margin:22px 0}
.pin-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;transition:.15s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:270px;margin:0 auto}
.pin-key{min-height:56px;border:1px solid var(--line);border-radius:16px;background:var(--soft);color:var(--text);font-size:19px;font-weight:800}
.pin-key:active{transform:scale(.94)}
.pin-key.ghost{background:transparent;border-color:transparent;color:var(--muted);font-size:11px;font-weight:800}
.pin-error{min-height:16px;margin-top:14px;color:var(--danger);font-size:11px;font-weight:700;text-align:center}
.pin-setup-card{padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--soft)}

/* Awards: richer progress header and badge states */

@keyframes badgeShine{0%,65%,100%{transform:translateX(-100%)}78%{transform:translateX(100%)}}

/* HAYGER v8 — profile, history and awards upgrade */
.profile-hero{position:relative;overflow:hidden}

<body>
<div class="app-shell">
  <header class="app-header">
    <div class="app-header-inner">
      <div>
        <div class="brand">HAYGER</div>
        <div class="brand-sub">ONE DAY AT A TIME</div>
      </div>
      <button id="themeButton" class="theme-button" type="button" aria-label="Change theme"></button>
    </div>
  </header>
  <main id="app" class="app-scroll"></main>
  <nav id="tabbar" class="app-tabbar" aria-label="Sections"></nav>
</div>
<div id="toast" class="toast" role="status"></div>
<canvas id="confettiCanvas" aria-hidden="true"></canvas>

<div id="modal" class="modal-backdrop" aria-hidden="true">
  <section class="modal" role="dialog" aria-modal="true">
    <h2>Change start date?</h2>
    <p>Your current Day count will be recalculated from the new date.</p>
    <div class="modal-actions">
      <button id="cancel" class="button secondary" type="button">Cancel</button>
      <button id="confirm" class="button primary" type="button">Change Date</button>
    </div>
  </section>
</div>

<div id="confirmModal" class="modal-backdrop" aria-hidden="true">
  <section class="modal danger" role="dialog" aria-modal="true">
    <h2 id="confirmModalTitle">Are you sure?</h2>
    <p id="confirmModalText"></p>
    <div class="modal-actions">
      <button id="confirmModalCancel" class="button secondary" type="button">Cancel</button>
      <button id="confirmModalOk" class="button primary" type="button">Confirm</button>
    </div>
  </section>
</div>

<div id="dayModal" class="modal-backdrop" aria-hidden="true">
  <section class="modal" role="dialog" aria-modal="true">
    <h2 id="dayModalTitle">Day</h2>
    <div id="dayModalBody"></div>
    <div class="modal-actions" style="grid-template-columns:1fr;margin-top:14px">
      <button id="dayModalClose" class="button secondary" type="button">Close</button>
    </div>
  </section>
</div>

<div id="updateBanner" class="update-banner" role="status" aria-live="polite">
  <div class="update-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12a8 8 0 0 1 14-5.2M20 12a8 8 0 0 1-14 5.2"/>
      <path d="M18 3v4h-4M6 21v-4h4"/>
    </svg>
  </div>
  <div class="update-copy">
    <b>New version available</b>
    <span>Update HAYGER to get the latest features.</span>
  </div>
  <button id="updateNow" class="update-button" type="button">UPDATE</button>
  <button id="updateClose" class="update-close" type="button" aria-label="Dismiss">✕</button>
</div>

<script>
(() => {
  "use strict";

  const START_KEY="hayger_start_date";
  const CHECKINS_KEY="hayger_checkins";
  const NOTES_KEY="hayger_notes";
  const GOAL_KEY="hayger_goal";
  const REMINDER_KEY="hayger_reminder";
  const THEME_KEY="hayger_theme";
  const PIN_KEY="hayger_pin";
  const PROFILE_KEY="hayger_profile_v3";
  const app=document.getElementById("app");
  const modal=document.getElementById("modal");
  const toast=document.getElementById("toast");
  let toastTimer;

  const JOURNEY_BADGES=[
    {day:3,icon:"🌱",label:"DAY 3"},{day:7,icon:"🔥",label:"1 WEEK"},
    {day:14,icon:"⚡",label:"2 WEEKS"},{day:30,icon:"🌙",label:"1 MONTH"},
    {day:50,icon:"⭐",label:"50 DAYS"},{day:75,icon:"💎",label:"75 DAYS"},
    {day:100,icon:"🏅",label:"100 DAYS"},{day:150,icon:"🚀",label:"150 DAYS"},
    {day:200,icon:"🛡️",label:"200 DAYS"},{day:365,icon:"🏆",label:"1 YEAR"},
    {day:500,icon:"👑",label:"500 DAYS"},{day:730,icon:"🌟",label:"2 YEARS"}
  ];
  const STREAK_BADGES=[
    {day:3,icon:"🔺",label:"3-STREAK"},{day:7,icon:"🔶",label:"7-STREAK"},
    {day:14,icon:"🔷",label:"14-STREAK"},{day:30,icon:"🟣",label:"30-STREAK"},
    {day:60,icon:"🟢",label:"60-STREAK"},{day:100,icon:"🔴",label:"100-STREAK"}
  ];
  const MOODS=["😊","🙂","😐","😔","😣"];

  const icons={
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 14.7A8.5 8.5 0 0 1 9.3 3.5 8.5 8.5 0 1 0 20.5 14.7Z"/></svg>',
    system:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>'
  };

  function get(k,f=null){try{return localStorage.getItem(k)??f}catch{return f}}
  function set(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}
  function remove(k){try{localStorage.removeItem(k)}catch{}}
  function readJSON(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}
  function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
  function checkins(){return readJSON(CHECKINS_KEY,{})}
  function notes(){return readJSON(NOTES_KEY,{})}
  function goal(){return Number(get(GOAL_KEY)||0)}
  function reminder(){return readJSON(REMINDER_KEY,{enabled:false,time:"20:00"})}
  function checkinKey(d){return toInputDate(d)}
  function escapeHTML(v){
    return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function challengeProgress(day){
    const g=goal();
    return g>0 ? Math.min(100,Math.round(day/g*100)) : 0;
  }
  function completedDays(){
    return Object.keys(checkins()).filter(k=>checkins()[k]).sort();
  }
  function streakStats(){
    const days=completedDays();
    if(!days.length) return {current:0,best:0,total:0};
    const set=new Set(days);
    let best=0, run=0, prev=null;
    for(const key of days){
      const d=parseDate(key);
      if(prev && Math.round((d-prev)/86400000)===1) run++;
      else run=1;
      best=Math.max(best,run);
      prev=d;
    }
    let current=0, cursor=today();
    while(set.has(toInputDate(cursor))){
      current++;
      cursor.setDate(cursor.getDate()-1);
    }
    return {current,best,total:days.length};
  }
  function checkinKey(d){return toInputDate(d)}
  function motivational(day){
    const m=["You don't need to win the year. Just win today.","Small steps still move you forward.","Keep showing up. That's the whole game.","Today counts. Make it yours.","Consistency gets stronger one day at a time.","You made it this far. Keep going."];
    return m[(day-1)%m.length];
  }
  function milestoneFor(day){
    const a=[7,30,50,100,365];
    return a.find(x=>day<=x)||Math.ceil(day/100)*100;
  }

  // ---- Ultra: badges ----
  function unlockedBadges(day,best){
    return {
      journey:JOURNEY_BADGES.map(b=>({...b,unlocked:day>=b.day})),
      streak:STREAK_BADGES.map(b=>({...b,unlocked:best>=b.day}))
    };
  }

  // ---- Ultra: PIN lock (SHA-256, device-local only — no recovery) ----
  async function sha256Hex(text){
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  function pinRecord(){return readJSON(PIN_KEY,null)}
  async function setPin(pin){
    writeJSON(PIN_KEY,{hash:await sha256Hex(pin)});
  }
  async function verifyPin(pin){
    const rec=pinRecord();
    if(!rec) return true;
    return (await sha256Hex(pin))===rec.hash;
  }
  function pinEnabled(){return !!pinRecord()}

  // ---- Ultra: weekly activity chart ----
  function weeksAgoMonday(offset){
    const d=today();
    const dow=(d.getDay()+6)%7;
    d.setDate(d.getDate()-dow-offset*7);
    return d;
  }
  function weeklyCounts(weeks){
    const data=checkins();
    const out=[];
    for(let w=weeks-1;w>=0;w--){
      const monday=weeksAgoMonday(w);
      let count=0;
      for(let i=0;i<7;i++){
        const d=new Date(monday);d.setDate(d.getDate()+i);
        if(d>today()) continue;
        if(data[toInputDate(d)]) count++;
      }
      out.push(count);
    }
    return out;
  }
  function drawWeeklyChart(canvas){
    if(!canvas) return;
    const counts=weeklyCounts(8);
    const dpr=window.devicePixelRatio||1;
    const w=canvas.clientWidth||280, h=canvas.clientHeight||74;
    canvas.width=w*dpr;canvas.height=h*dpr;
    const ctx=canvas.getContext("2d");
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,h);
    const styles=getComputedStyle(document.documentElement);
    const line=styles.getPropertyValue("--line").trim();
    const primary=styles.getPropertyValue("--accent").trim();
    const barW=Math.max(8,(w/counts.length)-8);
    counts.forEach((c,i)=>{
      const x=i*(w/counts.length)+((w/counts.length)-barW)/2;
      const barH=Math.max(3,(c/7)*(h-14));
      ctx.fillStyle=line;
      ctx.fillRect(x,h-14,barW,3);
      ctx.fillStyle=c>0?primary:line;
      ctx.beginPath();
      const r=Math.min(4,barW/2);
      const top=h-14-barH;
      ctx.moveTo(x,top+r);
      ctx.arcTo(x,top,x+r,top,r);
      ctx.lineTo(x+barW-r,top);
      ctx.arcTo(x+barW,top,x+barW,top+r,r);
      ctx.lineTo(x+barW,h-14);
      ctx.lineTo(x,h-14);
      ctx.closePath();
      ctx.fill();
    });
  }

  // ---- Ultra: confetti ----
  function fireConfetti(){
    const canvas=document.getElementById("confettiCanvas");
    if(!canvas) return;
    const dpr=window.devicePixelRatio||1;
    const w=window.innerWidth,h=window.innerHeight;
    canvas.width=w*dpr;canvas.height=h*dpr;
    canvas.style.width=w+"px";canvas.style.height=h+"px";
    const ctx=canvas.getContext("2d");
    ctx.scale(dpr,dpr);
    const colors=["#101114","#6b7078","#55bd7e","#f5c451","#e08a6b"];
    const particles=Array.from({length:70},()=>({
      x:Math.random()*w, y:-20-Math.random()*h*0.3,
      vx:(Math.random()-0.5)*2.4, vy:2+Math.random()*3,
      size:4+Math.random()*5, rot:Math.random()*Math.PI,
      vr:(Math.random()-0.5)*0.3, color:colors[Math.floor(Math.random()*colors.length)]
    }));
    let frame=0;
    function tick(){
      frame++;
      ctx.clearRect(0,0,w,h);
      particles.forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vy+=0.02;
        ctx.save();
        ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.fillStyle=p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        ctx.restore();
      });
      if(frame<130) requestAnimationFrame(tick);
      else ctx.clearRect(0,0,w,h);
    }
    tick();
  }

  function today(){

  // Reliable local-date parser. Avoids UTC/date-string timezone bugs.
  function parseDate(value){
    if(!value || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
    const p=value.split("-").map(Number);
    const d=new Date(p[0],p[1]-1,p[2]);
    if(Number.isNaN(d.getTime())) return null;
    if(d.getFullYear()!==p[0] || d.getMonth()!==p[1]-1 || d.getDate()!==p[2]) return null;
    return d;
  }

  function toInputDate(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

  function formatDate(d){
    return d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});

  function dayCount(start){
    const ms=24*60*60*1000;
    return Math.max(1,Math.round((today()-start)/ms)+1);
  }

  function heatmapWeeks(weeks){
    const data=checkins();
    const out=[];
    for(let w=weeks-1;w>=0;w--){
      const monday=weeksAgoMonday(w);
      const col=[];
      for(let i=0;i<7;i++){
        const d=new Date(monday);d.setDate(d.getDate()+i);
        col.push({date:d,future:d>today(),done:!!data[toInputDate(d)]});
      }
      out.push(col);
    }
    return out;
  }

      </div>
      ${pinSetupOpen?`<div class="pin-setup-card" style="margin-top:10px"><div class="setting-copy"><b>Set a 4-digit PIN</b><span>You'll need this every time you open HAYGER.</span></div><div class="pin-setup-row">${[0,1,2,3].map(i=>`<input class="pin-box pin-new" data-i="${i}" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]*">`).join("")}</div><div class="setting-copy" style="margin-top:12px"><b>Confirm PIN</b></div><div class="pin-setup-row">${[0,1,2,3].map(i=>`<input class="pin-box pin-confirm" data-i="${i}" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]*">`).join("")}</div><div id="pinSetupError" class="pin-error"></div><div class="goal-controls" style="margin-top:6px"><button id="pinSetupCancel" class="small-button" type="button">CANCEL</button><button id="pinSetupSave" class="small-button" type="button">SAVE PIN</button></div></div>`:""}
      <div class="settings-card" style="margin-top:10px"><div class="setting-row"><div class="setting-copy"><b>Reset everything</b><span>This permanently removes local HAYGER data.</span></div><button id="resetAll" class="danger-button" type="button">RESET HAYGER</button></div></div>
    </div>`;
  }
  function phasePanel(){
    if(phaseView==="calendar") return renderCalendar();
    if(phaseView==="stats") return renderStats();
    if(phaseView==="awards") return renderAwards();
    if(phaseView==="profile") return renderMore();
    return "";
  }


  let reminderTimer=null;
  function scheduleReminder(){
    clearTimeout(reminderTimer);
    const r=reminder();
    const status=document.getElementById("reminderStatus");
    if(!r.enabled){
      if(status)status.textContent="Reminder is off.";
      return;
    }
    const [hh,mm]=(r.time||"20:00").split(":").map(Number);
    const now=new Date(), next=new Date();
    next.setHours(hh||0,mm||0,0,0);
    if(next<=now) next.setDate(next.getDate()+1);
    const delay=Math.max(1000,next-now);
    reminderTimer=setTimeout(async()=>{
      try{
        if("Notification" in window && Notification.permission==="granted"){
          new Notification("HAYGER",{body:"Your day is waiting. Keep going.",icon:"./icon-192.png"});
        }
      }catch{}
      scheduleReminder();
    },delay);
    if(status) status.textContent=`Reminder set for ${r.time}. Notifications depend on browser/device support.`;
  }

  function exportData(){
    const payload={
      app:"HAYGER",version:1,exportedAt:new Date().toISOString(),
      startDate:get(START_KEY)||null,checkins:checkins(),notes:notes(),
      goal:goal(),reminder:reminder(),theme:theme(),profile:readProfile()
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url;a.download=`hayger-backup-${toInputDate(today())}.json`;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    showToast("✓ Backup exported.");
  }

  function importData(file){
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const d=JSON.parse(reader.result);
        if(d.app!=="HAYGER" || !d.version) throw new Error("Invalid backup");
        if(d.startDate){
          const s=parseDate(d.startDate);
          if(!s || s>today()) throw new Error("Invalid start date");
          localStorage.setItem(START_KEY,d.startDate);
        }
        writeJSON(CHECKINS_KEY,d.checkins&&typeof d.checkins==="object"?d.checkins:{});
        writeJSON(NOTES_KEY,d.notes&&typeof d.notes==="object"?d.notes:{});
        if(Number(d.goal)>0) localStorage.setItem(GOAL_KEY,String(Number(d.goal)));
        else remove(GOAL_KEY);
        if(d.reminder&&typeof d.reminder==="object") writeJSON(REMINDER_KEY,{enabled:!!d.reminder.enabled,time:d.reminder.time||"20:00"});
        if(["system","light","dark"].includes(d.theme)) localStorage.setItem(THEME_KEY,d.theme);
        if(d.profile&&typeof d.profile==="object"){writeJSON(PROFILE_KEY,d.profile);localStorage.setItem("hayger_profile_v2",JSON.stringify(d.profile));if(d.profile.name)localStorage.setItem("hayger_profile_name_v1",d.profile.name)}
        showToast("✓ Backup restored.");
        setTimeout(render,300);
      }catch{showToast("Backup file is not valid.");}
    };
    reader.readAsText(file);
  }

  function renderHome(start,current,day,data,key,checked){
    const next=milestoneFor(day), remaining=Math.max(0,next-day);
    const g=goal();
    const pct=g?challengeProgress(day):Math.min(100,Math.round((day/milestoneFor(day))*100));
    const r=88, c=2*Math.PI*r;
    const offset=c*(1-pct/100);
    return `<div class="container">
      <div class="hero-panel">
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 200 200">
            <circle class="ring-track" cx="100" cy="100" r="${r}"></circle>
            <circle class="ring-fill" cx="100" cy="100" r="${r}" style="stroke-dasharray:${c};stroke-dashoffset:${offset}"></circle>
          </svg>
          <div class="ring-center">
            <div class="ring-label">DAY</div>
            <div class="ring-number">${day}</div>
          </div>
        </div>
        <div class="hero-date">${formatDate(current)}</div>
        <div class="hero-tag"><span class="streak-dot"></span>One day at a time</div>
      </div>
      <p class="message">Started on <strong>${formatDate(start)}</strong> · “${motivational(day)}”</p>
      <div class="checkin">
        <div class="checkin-text">${checked?"Today's check-in is complete.":"Take a second to check in for today."}</div>
        <button id="checkinButton" class="checkin-button ${checked?"done":""}" type="button">${checked?"✓ CHECKED IN TODAY":"YES, I DID"}</button>
        ${checked?`<div class="mood-hint">How are you feeling today?</div>
        <div class="mood-row">${MOODS.map(m=>`<button class="mood-chip${data[key]&&data[key].mood===m?" active":""}" data-mood="${m}" type="button" aria-label="Mood ${m}">${m}</button>`).join("")}</div>`:""}
      </div>
      <div class="milestone" style="margin-top:16px">${remaining===0?`<strong>🏆 Day ${day} milestone reached.</strong>`:`Next milestone: <strong>Day ${next}</strong> · ${remaining} ${remaining===1?"day":"days"} to go`}</div>
      ${g?`<div class="goal-card" style="margin-top:14px"><div class="goal-row"><div class="goal-title">Your goal</div><div class="goal-value">${day} / ${g} days</div></div><div class="progress-track"><div class="progress-fill" style="width:${challengeProgress(day)}%"></div></div></div>`:""}
    </div>`;
  }

  function challenge(){
    const value=get(START_KEY);
    const start=parseDate(value);
    if(!start || start>today()){if(value)remove(START_KEY);setup();return}

    document.body.classList.add("has-tabbar");
    updateTabbar();

    const current=today(), day=dayCount(start);
    const data=checkins(), key=checkinKey(current), checked=!!data[key];

    if(phaseView==="home") app.innerHTML=renderHome(start,current,day,data,key,checked);
    else app.innerHTML=phasePanel();

    if(phaseView==="home"){
      document.getElementById("checkinButton").addEventListener("click",()=>{
        const d=checkins();
        if(d[key]){
          showToast("✓ Already checked in today.");
          return;
        }
        d[key]={day,at:new Date().toISOString()};
        writeJSON(CHECKINS_KEY,d);
        render();
        showToast("✓ Checked in for today.");
        if(JOURNEY_BADGES.some(b=>b.day===day)){
          fireConfetti();
          setTimeout(()=>showToast(`🏆 Milestone unlocked: Day ${day}`),400);
        }
      });

      document.querySelectorAll(".mood-chip").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const d=checkins();
          if(!d[key]) return;
          d[key].mood=d[key].mood===btn.dataset.mood?undefined:btn.dataset.mood;
          writeJSON(CHECKINS_KEY,d);
          render();
        });
      });
    }

    if(phaseView==="profile"){
      document.getElementById("saveProfile")?.addEventListener("click",()=>{
        const current=readProfile();
        const name=(document.getElementById("profileName")?.value||"").trim();
        if(!name){showToast("Please enter your name.");return}
        const data={
          ...current,name,
          username:(document.getElementById("profileUsername")?.value||"").trim().replace(/^@/,""),
          pronouns:(document.getElementById("profilePronouns")?.value||"").trim(),
          age:(document.getElementById("profileAge")?.value||"").trim(),
          gender:document.getElementById("profileGender")?.value||"",
          city:(document.getElementById("profileCity")?.value||"").trim(),
          website:(document.getElementById("profileWebsite")?.value||"").trim(),
          bio:(document.getElementById("profileBio")?.value||"").trim(),
          updatedAt:new Date().toISOString()
        };
        writeJSON(PROFILE_KEY,data);
        localStorage.setItem("hayger_profile_v2",JSON.stringify(data));
        localStorage.setItem("hayger_profile_name_v1",name);
        showToast("✓ Profile saved.");
        render();
      });
      document.getElementById("profilePhotoBtn")?.addEventListener("click",()=>document.getElementById("profilePhoto")?.click());
      document.getElementById("profilePhoto")?.addEventListener("change",e=>{
        const file=e.target.files?.[0]; if(!file) return;
        if(file.size>2.5*1024*1024){showToast("Photo must be under 2.5 MB.");return}
        const reader=new FileReader();
        reader.onload=()=>{const p=readProfile();p.photo=reader.result;writeJSON(PROFILE_KEY,p);localStorage.setItem("hayger_profile_v2",JSON.stringify(p));render();showToast("✓ Profile photo updated.")};
        reader.readAsDataURL(file);
      });
      document.getElementById("profileRemovePhoto")?.addEventListener("click",()=>{
        const p=readProfile();delete p.photo;writeJSON(PROFILE_KEY,p);localStorage.setItem("hayger_profile_v2",JSON.stringify(p));render();showToast("✓ Profile photo removed.");
      });

      document.getElementById("changeDate")?.addEventListener("click",openModal);
    }

    if(phaseView==="calendar"){
      document.getElementById("prevMonth").onclick=()=>{calendarCursor.setMonth(calendarCursor.getMonth()-1);render()};
      document.getElementById("nextMonth").onclick=()=>{calendarCursor.setMonth(calendarCursor.getMonth()+1);render()};
      document.getElementById("jumpToday").onclick=()=>{
        calendarCursor=new Date(today().getFullYear(),today().getMonth(),1);render();
      };
      document.querySelectorAll(".cal-day[data-date], .missed-item[data-date]").forEach(btn=>{
        btn.addEventListener("click",()=>openDayDetail(btn.dataset.date));
      });
    }

    if(phaseView==="stats"){
      drawWeeklyChart(document.getElementById("weeklyChart"));

      const save=document.getElementById("saveNote");
      if(save) save.onclick=()=>{
        const n=notes(), value=document.getElementById("dailyNote").value.trim(), key=editingNoteKey||toInputDate(today());
        if(!value){showToast("Write something before saving.");return;}
        n[key]=value;
        writeJSON(NOTES_KEY,n);
        showToast(editingNoteKey?"✓ Note updated.":"✓ Today's note saved.");
        editingNoteKey=null;
        render();
      };
      document.getElementById("cancelNoteEdit")?.addEventListener("click",()=>{editingNoteKey=null;render()});

      const goalSelect=document.getElementById("goalSelect");
      const goalCustom=document.getElementById("goalCustom");
      goalSelect?.addEventListener("change",()=>{
        goalCustom.style.display=goalSelect.value==="custom"?"":"none";
        if(goalSelect.value==="custom") goalCustom.focus();
      });
      const saveGoal=document.getElementById("saveGoal");
      if(saveGoal)saveGoal.onclick=()=>{
        let v;
        if(goalSelect.value==="custom"){
          v=Math.round(Number(goalCustom.value));
          if(!v||v<1){showToast("Enter a valid number of days.");return}
        }else v=Number(goalSelect.value);
        localStorage.setItem(GOAL_KEY,String(v));showToast(`✓ ${v}-day goal set.`);render();
      };

      const noteSearch=document.getElementById("noteSearch");
      if(noteSearch){
        noteSearch.addEventListener("input",()=>{
          noteSearchQuery=noteSearch.value;
          const cursor=noteSearch.selectionStart;
          render();
          const again=document.getElementById("noteSearch");
          if(again){again.focus();again.setSelectionRange(cursor,cursor)}
        });
      }
      document.querySelectorAll("[data-note-edit]").forEach(btn=>btn.addEventListener("click",()=>{
        editingNoteKey=btn.dataset.noteEdit;
        render();
        setTimeout(()=>document.getElementById("dailyNote")?.focus(),60);
      }));
      document.querySelectorAll("[data-note-delete]").forEach(btn=>btn.addEventListener("click",()=>{
        const key=btn.dataset.noteDelete, map=notes();
        if(!map[key]) return;
        askConfirm("Delete note?","This note will be permanently removed.").then(ok=>{
          if(ok){delete map[key];writeJSON(NOTES_KEY,map);render();showToast("✓ Note deleted.")}
        });
      }));

    }

    if(phaseView==="awards"){
      document.getElementById("shareProgressBtn")?.addEventListener("click",shareProgress);
      document.getElementById("exportAwards")?.addEventListener("click",exportData);
    }

    if(phaseView==="profile"){
      const enabled=document.getElementById("reminderEnabled");
      const time=document.getElementById("reminderTime");
      const saveReminder=async()=>{
        const next={enabled:!!enabled.checked,time:time.value||"20:00"};
        if(next.enabled && "Notification" in window && Notification.permission==="default"){
          try{await Notification.requestPermission()}catch{}
        }
        writeJSON(REMINDER_KEY,next);
        scheduleReminder();
      };
      enabled?.addEventListener("change",saveReminder);
      time?.addEventListener("change",saveReminder);
      scheduleReminder();

      document.getElementById("exportData")?.addEventListener("click",exportData);
      document.getElementById("importData")?.addEventListener("click",()=>document.getElementById("importFile")?.click());
      document.getElementById("importFile")?.addEventListener("change",e=>{
        const file=e.target.files?.[0];if(file)importData(file);
      });
      document.getElementById("cycleThemeMore")?.addEventListener("click",cycleTheme);
      document.getElementById("resetAll")?.addEventListener("click",async()=>{
        const ok=await askConfirm("Reset all HAYGER data?","This permanently removes your check-ins, notes, goals and settings from this device. This cannot be undone.");
        if(ok){
          [START_KEY,CHECKINS_KEY,NOTES_KEY,GOAL_KEY,REMINDER_KEY,THEME_KEY,PIN_KEY].forEach(remove);
          sessionStorage.removeItem("hayger_unlocked");
          location.reload();
        }
      });

      const pinToggle=document.getElementById("pinToggle");
      pinToggle?.addEventListener("change",async()=>{
        if(pinToggle.checked){
          pinSetupOpen=true;render();
        }else{
          const ok=await askConfirm("Turn off app lock?","HAYGER will open without a PIN from now on.");
          if(ok){remove(PIN_KEY);showToast("✓ App lock turned off.")}
          render();
        }
      });

      if(pinSetupOpen){
        const newBoxes=[...document.querySelectorAll(".pin-new")];
        const confirmBoxes=[...document.querySelectorAll(".pin-confirm")];
        function wirePinBoxes(boxes){
          boxes.forEach((box,i)=>{
            box.addEventListener("input",()=>{
              box.value=box.value.replace(/\D/g,"").slice(0,1);
              if(box.value&&boxes[i+1])boxes[i+1].focus();
            });
            box.addEventListener("keydown",e=>{
              if(e.key==="Backspace"&&!box.value&&boxes[i-1])boxes[i-1].focus();
            });
          });
        }
        wirePinBoxes(newBoxes);wirePinBoxes(confirmBoxes);
        newBoxes[0]?.focus();

        document.getElementById("pinSetupCancel")?.addEventListener("click",()=>{
          pinSetupOpen=false;render();
        });
        document.getElementById("pinSetupSave")?.addEventListener("click",async()=>{
          const err=document.getElementById("pinSetupError");
          const pin=newBoxes.map(b=>b.value).join("");
          const confirmPin=confirmBoxes.map(b=>b.value).join("");
          if(pin.length!==4){err.textContent="Enter all 4 digits.";return}
          if(pin!==confirmPin){err.textContent="PINs don't match.";return}
          await setPin(pin);
          pinSetupOpen=false;
          sessionStorage.setItem("hayger_unlocked","1");
          unlocked=true;
          showToast("✓ App lock turned on.");
          render();
        });
      }
    }
  }

  // Navigation for the tab bar is bound once, above, on the persistent tabbar element.

  let lockInput="";
  let lockErrorMsg="";
  function renderLock(){
    applyTheme();
    const dots=Array.from({length:4},(_,i)=>`<div class="pin-dot${i<lockInput.length?" filled":""}"></div>`).join("");
    document.body.classList.remove("has-tabbar");
    app.innerHTML=`<div class="container">
      <div class="setup">
        <div class="setup-icon">H</div>
        <h1>Locked</h1>
        <p>Enter your PIN to open HAYGER.</p>
      </div>
      <div class="pin-dots">${dots}</div>
      <div id="lockError" class="pin-error">${escapeHTML(lockErrorMsg)}</div>
      <div class="pin-keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" data-key="${n}" type="button">${n}</button>`).join("")}
        <span></span>
        <button class="pin-key" data-key="0" type="button">0</button>
        <button class="pin-key ghost" data-key="del" type="button">DEL</button>
      </div>
      <div class="lock-footer"><button id="lockResetLink" type="button">Forgot PIN? Reset HAYGER</button></div>
    </div>`;

    document.querySelectorAll(".pin-key").forEach(btn=>{
      btn.addEventListener("click",async()=>{
        const k=btn.dataset.key;
        if(k==="del"){lockInput=lockInput.slice(0,-1);lockErrorMsg="";renderLock();return}
        if(lockInput.length>=4) return;
        lockInput+=k;
        lockErrorMsg="";
        if(lockInput.length===4){
          renderLock();
          const ok=await verifyPin(lockInput);
          if(ok){
            unlocked=true;
            sessionStorage.setItem("hayger_unlocked","1");
            lockInput="";
            lockErrorMsg="";
            render();
          }else{
            lockErrorMsg="Incorrect PIN. Try again.";
            lockInput="";
            renderLock();
          }
          return;
        }
        renderLock();
      });
    });

    document.getElementById("lockResetLink")?.addEventListener("click",async()=>{
      const ok=await askConfirm("Reset all HAYGER data?","This permanently removes your check-ins, notes, goals and settings from this device — including the PIN. This cannot be undone.");
      if(ok){
        [START_KEY,CHECKINS_KEY,NOTES_KEY,GOAL_KEY,REMINDER_KEY,THEME_KEY,PIN_KEY].forEach(remove);
        sessionStorage.removeItem("hayger_unlocked");
        location.reload();
      }
    });
  }

  function render(){
    if(pinEnabled()&&!unlocked){renderLock();return}
    applyTheme();challenge();
  }

  function openModal(){modal.classList.add("open");modal.setAttribute("aria-hidden","false")}
  function closeModal(){modal.classList.remove("open");modal.setAttribute("aria-hidden","true")}
  function showToast(text){
    clearTimeout(toastTimer);toast.textContent=text;toast.classList.add("show");
    toastTimer=setTimeout(()=>toast.classList.remove("show"),2200);
  }

  document.getElementById("cancel").addEventListener("click",closeModal);
  document.getElementById("confirm").addEventListener("click",()=>{remove(START_KEY);remove(CHECKINS_KEY);remove(NOTES_KEY);remove(GOAL_KEY);remove(REMINDER_KEY);closeModal();render()});
  modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDayDetail();}});

  if(window.matchMedia){
    const mq=window.matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener?.("change",()=>{if(theme()==="system")render()});
  }

  // PWA update handling: show the user a prompt when a new service worker is waiting.
  let pendingWorker=null;
  let updateBannerDismissed=false;

  function showUpdateBanner(worker){
    if(updateBannerDismissed) return;
    pendingWorker=worker;
    document.getElementById("updateBanner")?.classList.add("show");
  }

  document.getElementById("updateNow")?.addEventListener("click",()=>{
    if(pendingWorker){
      pendingWorker.postMessage("SKIP_WAITING");
    }
  });

  document.getElementById("updateClose")?.addEventListener("click",()=>{
    updateBannerDismissed=true;
    document.getElementById("updateBanner")?.classList.remove("show");
  });

  if("serviceWorker" in navigator && location.protocol!=="file:"){
    window.addEventListener("load",async()=>{
      try{
        const registration=await navigator.serviceWorker.register("./sw.js",{scope:"./"});

        if(registration.waiting && navigator.serviceWorker.controller){
          showUpdateBanner(registration.waiting);
        }

        registration.addEventListener("updatefound",()=>{
          const worker=registration.installing;
          if(!worker) return;
          worker.addEventListener("statechange",()=>{
            if(worker.state==="installed" && navigator.serviceWorker.controller){
              showUpdateBanner(worker);
            }
          });
        });

        // Check for a newer version whenever the app comes back to the foreground.
        document.addEventListener("visibilitychange",()=>{
          if(document.visibilityState==="visible") registration.update().catch(()=>{});
        });
      }catch{}
    });

    // The new service worker is now active; reload once to use the new files.
    let refreshing=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(refreshing) return;
      refreshing=true;
      window.location.reload();
    });
  }

  render();
})();
</script>
<script id="hayger-note-actions-js">
(()=>{const candidates=["hayger_notes","hayger_notes_v1","notes","haygerNotes"];function key(){return candidates.find(k=>localStorage.getItem(k)!=null)||"hayger_notes_v1"}
function read(){try{const x=JSON.parse(localStorage.getItem(key())||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function write(x){localStorage.setItem(key(),JSON.stringify(x))}
window.HAYGER_NOTES={edit(i,text){const a=read();if(!a[i])return;a[i]=typeof a[i]==="string"?text:{...a[i],text};write(a);location.reload()},remove(i){const a=read();if(!a[i])return;if(confirm("Delete this note?")){a.splice(i,1);write(a);location.reload()}}};
window.addEventListener("load",()=>{
 document.querySelectorAll("[data-note-index]").forEach((el)=>{
   const i=Number(el.dataset.noteIndex);if(!Number.isInteger(i))return;
   if(el.querySelector(".note-actions"))return;
   const box=document.createElement("div");box.className="note-actions";
   box.innerHTML='<button type="button" class="note-edit">EDIT</button><button type="button" class="note-delete">DELETE</button>';
   box.querySelector(".note-edit").onclick=()=>{const a=read(),old=a[i];const oldText=typeof old==="string"?old:(old?.text||"");const n=prompt("Edit note",oldText);if(n!==null&&n.trim())window.HAYGER_NOTES.edit(i,n.trim())};
   box.querySelector(".note-delete").onclick=()=>window.HAYGER_NOTES.remove(i);
   el.appendChild(box);
 });
});
})();
</script>
