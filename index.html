<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>HAYGER — Ultimate Max</title>

<style>
:root {
  --bg: #f2f4f7; --surface: #ffffff; --soft: #f0f2f5; --soft2: #e4e7eb;
  --text: #111827; --muted: #6b7280; --line: #e5e7eb; --danger: #ef4444;
  --primary: #111827; --primaryText: #ffffff; --accent: #10b981;
  --shadow: 0 20px 40px -10px rgba(0,0,0,0.05);
  --radius-xl: 32px; --radius-lg: 24px; --radius-md: 16px;
}
[data-theme=dark] {
  --bg: #030405; --surface: #0d0e10; --soft: #16181b; --soft2: #1f2226;
  --text: #f9fafb; --muted: #9ca3af; --line: #26292e; --danger: #ff5f5f;
  --primary: #f9fafb; --primaryText: #030405;
  --shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  transition: background 0.4s, color 0.4s; user-select: none;
}

.app { max-width: 480px; margin: 0 auto; padding: 20px 16px 120px; }

/* Components */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-xl); padding: 24px; box-shadow: var(--shadow);
  animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.logo { font-size: 20px; font-weight: 900; letter-spacing: 3px; }

.hero {
  background: var(--soft); border-radius: var(--radius-lg); padding: 40px 20px;
  text-align: center; position: relative; overflow: hidden; border: 1px solid var(--line);
}
.hero-day { font-size: 90px; font-weight: 950; letter-spacing: -5px; line-height: 0.9; margin: 10px 0; }
.streak-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
  background: var(--accent); color: white; border-radius: 99px; font-size: 11px; font-weight: 800;
}

/* Nav */
.tab-nav {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 400px; background: var(--primary);
  border-radius: 20px; display: flex; padding: 6px; z-index: 1000; box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}
.tab-item {
  flex: 1; padding: 12px; border-radius: 14px; border: 0; background: transparent;
  color: var(--muted); font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.2s;
}
.tab-item.active { background: var(--surface); color: var(--text); }

/* Heatmap */
.heatmap { display: flex; gap: 4px; overflow-x: auto; padding: 10px 0; }
.heat-col { display: flex; flex-direction: column; gap: 4px; }
.heat-cell { width: 11px; height: 11px; border-radius: 2px; background: var(--soft2); }
.heat-cell.done { background: var(--accent); }

/* Buttons & Inputs */
.btn {
  width: 100%; padding: 18px; border: 0; border-radius: 16px; font-weight: 800;
  cursor: pointer; transition: 0.2s; font-size: 14px;
}
.btn-primary { background: var(--primary); color: var(--primaryText); }
.btn-secondary { background: var(--soft); color: var(--text); border: 1px solid var(--line); }
.btn:active { transform: scale(0.96); }

/* Update Banner */
#updateBanner {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150%);
  width: 90%; max-width: 400px; background: var(--surface); border: 1px solid var(--accent);
  padding: 16px; border-radius: 16px; z-index: 2000; box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: space-between; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
#updateBanner.show { transform: translateX(-50%) translateY(0); }

/* PIN Screen */
#pinLock {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: none; flex-direction: column; align-items: center; justify-content: center;
}
.pin-dots { display: flex; gap: 16px; margin-bottom: 40px; }
.pin-dot { width: 14px; height: 14px; border: 2px solid var(--line); border-radius: 50%; }
.pin-dot.fill { background: var(--text); border-color: var(--text); transform: scale(1.2); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
.key {
  width: 70px; height: 70px; border-radius: 50%; background: var(--surface);
  display: grid; place-items: center; font-size: 24px; font-weight: 700; cursor: pointer;
}

</style>
</head>
<body>

<div id="updateBanner">
  <div style="font-size: 13px; font-weight: 700;">Update Available! 🚀</div>
  <button onclick="window.location.reload()" class="btn-primary" style="width: auto; padding: 8px 16px; border-radius: 10px; font-size: 11px;">Refresh</button>
</div>

<div id="pinLock">
  <div class="logo" style="margin-bottom: 40px;">HAYGER</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="keypad" id="keypad"></div>
  <button onclick="resetApp()" style="margin-top:40px; background:none; border:0; color:var(--muted); font-size:12px; text-decoration:underline">Forgot PIN? Reset</button>
</div>

<div class="app" id="app"></div>

<nav class="tab-nav" id="mainNav" style="display: none;">
  <button class="tab-item active" onclick="switchTab('home')">HOME</button>
  <button class="tab-item" onclick="switchTab('stats')">STATS</button>
  <button class="tab-item" onclick="switchTab('awards')">AWARDS</button>
  <button class="tab-item" onclick="switchTab('settings')">MORE</button>
</nav>

<canvas id="confetti" style="position:fixed; inset:0; pointer-events:none; z-index:1001;"></canvas>

<script>
// --- CORE LOGIC ---
const STORAGE = {
  START: 'hg_start', LOGS: 'hg_logs', PIN: 'hg_pin', THEME: 'hg_theme', NOTES: 'hg_notes'
};

let state = {
  tab: 'home',
  isLocked: !!localStorage.getItem(STORAGE.PIN),
  pinBuffer: ''
};

const getLogs = () => JSON.parse(localStorage.getItem(STORAGE.LOGS) || '{}');
const saveLog = (date) => {
  const logs = getLogs();
  logs[date] = { checked: true };
  localStorage.setItem(STORAGE.LOGS, JSON.stringify(logs));
};

const todayStr = () => new Date().toISOString().split('T')[0];

function calculateStreak() {
  const logs = getLogs();
  const keys = Object.keys(logs).sort().reverse();
  if (keys.length === 0) return 0;

  let streak = 0;
  let current = new Date();
  
  // Logic: Agar aaj check nahi kiya, toh kal se streak ginna shuru karo
  if (!logs[todayStr()]) {
    current.setDate(current.getDate() - 1);
  }

  while (logs[current.toISOString().split('T')[0]]) {
    streak++;
    current.setDate(current.getDate() - 1);
  }
  return streak;
}

// --- UI RENDERING ---
function render() {
  const root = document.getElementById('app');
  const startDate = localStorage.getItem(STORAGE.START);

  if (!startDate) {
    renderSetup(root);
    return;
  }

  document.getElementById('mainNav').style.display = 'flex';
  
  switch(state.tab) {
    case 'home': renderHome(root); break;
    case 'stats': renderStats(root); break;
    case 'awards': renderAwards(root); break;
    case 'settings': renderSettings(root); break;
  }
}

function renderSetup(el) {
  el.innerHTML = `
    <div class="card" style="text-align: center;">
      <div class="logo" style="margin-bottom: 20px;">HAYGER</div>
      <h1 style="letter-spacing: -1px;">Welcome back.</h1>
      <p style="color: var(--muted); font-size: 14px;">Choose your journey start date:</p>
      <input type="date" id="startDateInput" class="btn btn-secondary" style="margin-bottom: 20px;" value="${todayStr()}">
      <button onclick="startJourney()" class="btn btn-primary">START JOURNEY</button>
    </div>
  `;
}

function renderHome(el) {
  const start = new Date(localStorage.getItem(STORAGE.START));
  const diff = Math.floor((new Date() - start) / 86400000) + 1;
  const hasChecked = !!getLogs()[todayStr()];

  el.innerHTML = `
    <div class="header">
      <div class="logo">HAYGER</div>
      <button onclick="toggleTheme()" class="btn-secondary" style="width:40px; height:40px; border-radius:12px; padding:0;">🌓</button>
    </div>
    <div class="hero">
      <div style="font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 2px;">JOURNEY DAY</div>
      <div class="hero-day">${diff}</div>
      <div class="streak-chip">🔥 ${calculateStreak()} DAY STREAK</div>
    </div>
    <div class="card" style="margin-top: 20px;">
      <div style="font-size: 12px; font-weight: 800; margin-bottom: 15px;">ACTIVITY HEATMAP</div>
      <div class="heatmap">${renderHeatmap()}</div>
      <button onclick="checkIn()" class="btn ${hasChecked ? 'btn-secondary' : 'btn-primary'}" style="margin-top: 20px;" ${hasChecked ? 'disabled' : ''}>
        ${hasChecked ? '✓ COMPLETED TODAY' : 'MARK DONE FOR TODAY'}
      </button>
    </div>
  `;
}

function renderHeatmap() {
  const logs = getLogs();
  let html = '';
  const d = new Date();
  d.setDate(d.getDate() - 70); // Show 10 weeks

  for(let i=0; i<11; i++) {
    html += '<div class="heat-col">';
    for(let j=0; j<7; j++) {
      const s = d.toISOString().split('T')[0];
      html += `<div class="heat-cell ${logs[s] ? 'done' : ''}"></div>`;
      d.setDate(d.getDate() + 1);
    }
    html += '</div>';
  }
  return html;
}

// --- TAB SYSTEM ---
function switchTab(t) {
  state.tab = t;
  document.querySelectorAll('.tab-item').forEach(btn => {
    btn.classList.toggle('active', btn.innerText.toLowerCase() === t);
  });
  render();
}

// --- ACTIONS ---
function startJourney() {
  const val = document.getElementById('startDateInput').value;
  localStorage.setItem(STORAGE.START, val);
  render();
}

function checkIn() {
  saveLog(todayStr());
  fireConfetti();
  render();
}

function toggleTheme() {
  const current = localStorage.getItem(STORAGE.THEME) || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  localStorage.setItem(STORAGE.THEME, next);
  document.documentElement.dataset.theme = next;
}

// --- PIN LOCK SYSTEM ---
function initKeypad() {
  const pad = document.getElementById('keypad');
  [1,2,3,4,5,6,7,8,9,'C',0,'X'].forEach(key => {
    const div = document.createElement('div');
    div.className = 'key';
    div.innerText = key;
    div.onclick = () => handlePin(key);
    pad.appendChild(div);
  });
}

function handlePin(key) {
  if (key === 'C') state.pinBuffer = '';
  else if (key === 'X') state.pinBuffer = state.pinBuffer.slice(0,-1);
  else if (state.pinBuffer.length < 4) state.pinBuffer += key;

  const dots = document.getElementById('pinDots').children;
  for(let i=0; i<4; i++) dots[i].classList.toggle('fill', i < state.pinBuffer.length);

  if (state.pinBuffer === localStorage.getItem(STORAGE.PIN)) {
    document.getElementById('pinLock').style.display = 'none';
    render();
  } else if (state.pinBuffer.length === 4) {
    state.pinBuffer = '';
    setTimeout(() => { for(let i=0; i<4; i++) dots[i].classList.remove('fill'); }, 200);
  }
}

// --- EFFECTS ---
function fireConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  let particles = Array.from({length: 60}, () => ({
    x: Math.random() * canvas.width, y: canvas.height,
    v: 10 + Math.random() * 15, r: 4 + Math.random() * 6,
    c: `hsl(${Math.random() * 360}, 70%, 50%)`, a: (Math.random() - 0.5) * 4
  }));

  function frame() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
      p.y -= p.v; p.x += p.a; p.v *= 0.96;
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    });
    if(particles[0].v > 0.1) requestAnimationFrame(frame);
  }
  frame();
}

function resetApp() {
    if(confirm("Delete everything?")) {
        localStorage.clear();
        location.reload();
    }
}

// --- INIT ---
window.onload = () => {
  const theme = localStorage.getItem(STORAGE.THEME) || 'light';
  document.documentElement.dataset.theme = theme;
  
  if (localStorage.getItem(STORAGE.PIN)) {
    document.getElementById('pinLock').style.display = 'flex';
    initKeypad();
  } else {
    render();
  }

  // PWA Update Listener
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            document.getElementById('updateBanner').classList.add('show');
          }
        });
      });
    });
  }
};
</script>
</body>
</html>
